<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Coord pilot taskboard</title>
    <link rel="stylesheet" href="/style.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main>
      <p class="eyebrow">Local pilot fixture</p>
      <h1>Taskboard</h1>
      <p>Add a task, then check it off when it is complete.</p>
      <form id="add-task">
        <label for="title">Task title</label>
        <p id="title-help">Use up to 160 characters. Tasks reset when the server restarts.</p>
        <div class="add-row">
          <input id="title" name="title" type="text" required maxlength="160" aria-describedby="title-help" autocomplete="off">
          <button type="submit">Add task</button>
        </div>
      </form>
      <section aria-labelledby="tasks-heading">
        <h2 id="tasks-heading">Your tasks</h2>
        <p id="count">No tasks loaded.</p>
        <p id="empty" hidden>No tasks yet. Add one above.</p>
        <ul id="tasks" aria-label="Tasks"></ul>
      </section>
      <p id="status" role="status" aria-live="polite" aria-atomic="true">Loading tasks…</p>
    </main>
  </body>
</html>
